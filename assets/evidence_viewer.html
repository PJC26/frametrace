<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Theme resolves before first paint (no flash): the shared ft-theme
    // key falls back to the OS preference. Same key as the workstation
    // shell, so the examiner's choice follows into the hosted / legacy iframe viewer.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("ft-theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) {}
  </script>

    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); overflow: hidden; }
  </style>
</head>
