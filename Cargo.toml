[package]
name = "frametrace"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
publish = false
default-run = "frametrace"

[lib]
name = "frametrace"
path = "src/lib.rs"

[[bin]]
name = "frametrace"
path = "src/main.rs"

[[bin]]
name = "frametrace-app"
path = "src/app.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
fs2 = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.39.0", features = ["bundled", "backup"] }
wait-timeout = "0.2"
getrandom = "0.4.3"

[target."cfg(windows)".dependencies]
webview2-com = "0.38.0"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Console", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp"] }
