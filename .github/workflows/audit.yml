name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches advisories published against unchanged dependencies.
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # R5 U13: bounded, never the 6 h default
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Prebuilt binary: `cargo install cargo-audit` builds with the pinned
      # 1.94 toolchain and its dependencies now need a newer rustc.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
      # --deny warnings: unmaintained/unsound/yanked advisories fail the job
      # too. Accepted advisories must be listed in .cargo/audit.toml
      # ([advisories] ignore = [...]) with a reason and a re-check date;
      # see docs/security-review.md "Dependency audit policy".
      - name: cargo audit (deny warnings)
        run: cargo audit --deny warnings
