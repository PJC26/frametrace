name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches advisories published against unchanged dependencies.
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary: `cargo install cargo-audit` builds with the pinned
      # 1.94 toolchain and its dependencies now need a newer rustc.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
