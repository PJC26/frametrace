name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 120 # R5 U13: bounded, never the 6 h default
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; toolchain pinned via input
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Frontend asset checks
        run: node scripts/check-css.mjs
      - name: Contract pin drift-check
        run: node scripts/verify-contract-pin.mjs
      - name: Viewer JavaScript syntax
        run: node scripts/check-js.mjs
      - name: Install external tools
        run: brew install ffmpeg libewf sleuthkit
      - name: Test
        run: cargo test --locked
      - name: Integration tests with real tools (ffmpeg, libewf; fails if a tool is missing)
        env:
          FRAMETRACE_IT: "1"
        run: cargo test --locked --test integration_tools -- --ignored
      - name: Workstation end-to-end test
        env:
          FRAMETRACE_IT: "1"
        run: cargo test --locked --test workstation_e2e -- --ignored
      - name: QA performance smoke
        run: cargo run --locked --bin frametrace -- qa performance target/frametrace-ci-performance --rows 1000
      - name: Release build
        run: cargo build --release --locked
