name: Fuzz smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # R5 U13: bounded, never the 6 h default
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Pinned stable toolchain for rustfmt; rust-toolchain.toml keeps bare
      # `cargo` on 1.94.0, matching the other CI jobs.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; toolchain pinned via input
        with:
          toolchain: 1.94.0
          components: rustfmt
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; toolchain pinned via input
        with:
          # Date-pinned so a nightly regression cannot break CI unrelated to
          # the change under test; bump deliberately (keep in sync with the
          # `+nightly-...` below and fuzz/README.md).
          toolchain: nightly-2026-10-01
      - name: Format fuzz targets
        run: cargo fmt --check
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
        working-directory: .
      - name: Build fuzz targets
        run: cargo +nightly-2026-10-01 fuzz build
      - name: Smoke-run each fuzz target for 60s
        run: |
          for target in audit_jsonl_verify index_jsonl_records carve_signature_scan creation_time_unix dav_walk_frames rectime_parse dfxml_export; do
            echo "=== $target ==="
            cargo +nightly-2026-10-01 fuzz run "$target" -- -max_total_time=60
          done
